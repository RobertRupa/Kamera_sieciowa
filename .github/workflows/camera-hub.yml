name: Camera Hub development foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t camera-hub-host-tests -f tests/host/Dockerfile tests/host
      - run: docker run --rm -v "$PWD:/workspace" camera-hub-host-tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  diagnostic-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace/firmware
          espressif/idf:v6.1 idf.py -B /workspace/build/p4
          -D SDKCONFIG=/workspace/build/sdkconfig.p4 -D IDF_TARGET=esp32p4 build